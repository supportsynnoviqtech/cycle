<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2">
<title id="t2">Illustration of a quiet harbour trail at dusk with a prominent urban bicycle</title>
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="55%" stop-color="#1E3A8A"/>
    <stop offset="100%" stop-color="#D97706"/>
  </linearGradient>
  <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E293B"/>
    <stop offset="100%" stop-color="#0F172A"/>
  </linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#sky2)"/>
<g fill="#F7F5F0" opacity="0.8">
  <circle cx="220" cy="140" r="2.5"/><circle cx="380" cy="90" r="2"/><circle cx="520" cy="180" r="2.5"/>
  <circle cx="700" cy="70" r="2"/><circle cx="900" cy="120" r="2.5"/><circle cx="1080" cy="80" r="2"/>
  <circle cx="1260" cy="160" r="2.5"/><circle cx="1420" cy="100" r="2"/>
</g>
<!-- City Silhouette -->
<g fill="#0F172A" opacity="0.7">
  <rect x="750" y="380" width="80" height="180"/>
  <rect x="850" y="320" width="110" height="240"/>
  <rect x="980" y="420" width="90" height="140"/>
  <rect x="1100" y="350" width="130" height="210"/>
  <rect x="1250" y="400" width="100" height="160"/>
  <rect x="1370" y="330" width="120" height="230"/>
</g>
<!-- Ground and Harbour Trail -->
<path d="M0 520 Q800 460 1600 520 L1600 1000 L0 1000 Z" fill="url(#ground2)"/>
<!-- Bicycle Artwork on Right Side -->
<g transform="translate(980, 420)" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Rear & Front Wheels -->
  <circle cx="0" cy="80" r="65" stroke="#FFFFFF" stroke-width="10" fill="#0F172A"/>
  <circle cx="0" cy="80" r="6" fill="#F59E0B" stroke="none"/>
  <circle cx="220" cy="80" r="65" stroke="#FFFFFF" stroke-width="10" fill="#0F172A"/>
  <circle cx="220" cy="80" r="6" fill="#F59E0B" stroke="none"/>
  <!-- Spokes -->
  <path d="M0 15 L0 145 M-65 80 L65 80" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  <path d="M220 15 L220 145 M155 80 L285 80" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  <!-- Frame Geometry -->
  <path d="M0 80 L90 5 L155 5 L220 80"/>
  <path d="M90 5 L70 80 L0 80"/>
  <path d="M70 80 L155 5"/>
  <!-- Handlebars & Seat -->
  <path d="M70 -35 L130 -35" stroke-width="12" stroke="#FFFFFF"/>
  <path d="M155 5 L145 -30 M130 -30 L180 -30" stroke-width="10" stroke="#FFFFFF"/>
  <!-- Headlight -->
  <circle cx="185" cy="-30" r="8" fill="#F59E0B" stroke="none"/>
  <path d="M193 -30 L220 -40 M193 -30 L220 -20" stroke="#F59E0B" stroke-width="3" opacity="0.8"/>
</g>
<g fill="#F59E0B" opacity="0.9">
  <circle cx="120" cy="220" r="4"/><circle cx="260" cy="200" r="4"/><circle cx="400" cy="220" r="4"/>
  <circle cx="540" cy="200" r="4"/><circle cx="680" cy="220" r="4"/><circle cx="820" cy="200" r="4"/>
  <circle cx="960" cy="220" r="4"/><circle cx="1100" cy="200" r="4"/><circle cx="1240" cy="220" r="4"/>
  <circle cx="1380" cy="200" r="4"/>
</g>
</svg>
